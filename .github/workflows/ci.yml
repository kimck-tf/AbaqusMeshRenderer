name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check meshview tests
      - name: Pytest
        # No display/EGL on the runner -> GL smoke tests skip automatically.
        run: pytest -q

  build:
    name: Build onefile exe (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: python build.py
      - name: Smoke-test the frozen binary
        run: dist/meshview.exe --info tests/fixtures/single_hex.inp
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshview-windows
          path: dist/meshview.exe
